# MODELO SEM CREDENCIAIS. Preencha em Settings > Secrets no Community Cloud.
# Substitua SEU-APP pela URL escolhida e cadastre a mesma URI no cliente Google.
# Não substitua o secrets.toml local: localhost continua sendo usado no computador.
[auth]
redirect_uri = "https://SEU-APP.streamlit.app/oauth2callback"
cookie_secret = ""

[auth.google]
client_id = ""
client_secret = ""
server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"
